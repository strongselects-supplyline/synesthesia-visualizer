<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synesthesia Visualizer // past.El</title>
    <meta name="description"
        content="Real-time synesthetic music visualizer by past.El. Experience music as color, light, and motion.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@300;500;700&display=swap"
        rel="stylesheet">

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>
    <!-- WebGL fills the screen — this IS the experience -->
    <canvas id="visualizerCanvas"></canvas>

    <!-- Hidden audio element for catalog playback -->
    <audio id="catalogAudioPlayer" crossorigin="anonymous"></audio>

    <!-- Subtle hint that fades away — hidden in embed mode -->
    <div id="panelHint" class="panel-hint">
        <span class="hint-key">TAB</span> controls
    </div>

    <!-- ================================================
         CONTROL PANEL — Hidden by default, slides in from left
         ================================================ -->
    <div id="controlPanel" class="control-panel">
        <div class="panel-inner">
            <div class="panel-header">
                <h2 class="panel-title">Synesthesia <span class="accent">Visualizer</span></h2>
                <p class="panel-sub">past.El</p>
            </div>

            <!-- Mode Toggles -->
            <div class="mode-toggles">
                <button id="modeCatalogBtn" class="glass-btn active">Catalog</button>
                <button id="modeLiveBtn" class="glass-btn">Live Audio</button>
                <button id="modeEventBtn" class="glass-btn">Event</button>
            </div>

            <!-- Catalog Controls -->
            <div id="catalogControls" class="control-group">
                <label for="trackSelector">Select Track</label>
                <select id="trackSelector" class="glass-select"></select>
                <div id="catalogPlaybackStatus" class="playback-status"></div>
            </div>

            <!-- Live Audio Controls -->
            <div id="liveAudioControls" class="control-group hidden">
                <label>Audio Source</label>
                <div class="radio-group">
                    <input type="radio" id="srcFile" name="audioSrc" value="file" checked>
                    <label for="srcFile">File</label>
                    <input type="radio" id="srcMic" name="audioSrc" value="mic">
                    <label for="srcMic">Mic</label>
                </div>
                <div class="file-upload-wrapper">
                    <label for="audioFileUpload" class="glass-btn upload-btn">Choose Audio File</label>
                    <input type="file" id="audioFileUpload" accept="audio/*" style="display:none;">
                    <div id="uploadFileName" class="upload-filename"></div>
                </div>
                <div class="beat-readout">
                    <span class="beat-dot" id="beatDot"></span>
                    <span id="bpmDisplay" class="bpm-value">— BPM</span>
                </div>
                <div class="key-readout">
                    <span class="key-label">Detected Key</span>
                    <span id="detectedKeyDisplay" class="key-value">Listening...</span>
                </div>
            </div>

            <!-- Parameters -->
            <div class="param-section">
                <div class="param-row">
                    <span class="param-label">Hex</span>
                    <span id="hexDisplay" class="param-value">#2d3142</span>
                </div>
                <div class="param-row">
                    <span class="param-label">Forge</span>
                    <input type="range" id="forgeSlider" min="0" max="100" value="100" class="glass-range">
                </div>
                <div class="param-row">
                    <span class="param-label">Intensity</span>
                    <input type="range" id="intensitySlider" min="1" max="100" value="50" class="glass-range">
                </div>
            </div>

            <!-- MIDI -->
            <div class="param-section midi-section">
                <div class="param-row">
                    <span class="param-label">MIDI</span>
                    <span id="midiStatus" class="midi-status">Searching...</span>
                </div>
                <div id="midiLearnContainer" class="midi-learn-grid"></div>
            </div>

            <!-- Export Section (hidden in embed mode) -->
            <div class="export-section param-section" id="exportSection">
                <div class="param-row">
                    <span class="param-label">Export</span>
                    <span class="export-hint">R = 30s quick</span>
                </div>
                <div class="export-dur-row">
                    <button class="export-dur-btn glass-btn" data-dur="15">15s</button>
                    <button class="export-dur-btn glass-btn active" data-dur="30">30s</button>
                    <button class="export-dur-btn glass-btn" data-dur="60">60s</button>
                </div>
                <div class="export-audio-row">
                    <label for="exportAudioToggle" class="param-label">Audio</label>
                    <input type="checkbox" id="exportAudioToggle" checked>
                </div>
                <div class="export-actions">
                    <button id="exportCaptureBtn" class="glass-btn export-capture-btn">CAPTURE</button>
                    <button id="exportStillBtn" class="glass-btn export-still-btn">PNG</button>
                </div>
                <div id="exportStatus" class="export-status"></div>
                <div id="exportLastFile" class="export-lastfile"></div>
            </div>

            <div class="panel-footer">
                <span class="footer-hint"><span class="hint-key">F</span> fullscreen · <span class="hint-key">TAB</span> hide · <span class="hint-key">R</span> record</span>
            </div>
        </div>
    </div>

    <!-- Event Mode Overlay -->
    <div id="eventOverlay" class="event-overlay hidden">
        <div class="event-title-card">
            <div class="event-album-title">ALL LOVE</div>
            <div class="event-artist">past.El</div>
            <div class="event-track-info">
                <span class="event-track-number"></span>
                <span class="event-track-title"></span>
            </div>
            <button id="eventStartBtn" class="event-start-btn">Begin Experience</button>
        </div>
    </div>

    <!-- Event End Overlay -->
    <div id="eventEndOverlay" class="event-end-overlay hidden">
        <div class="event-end-text">the love continues...</div>
    </div>

    <!-- Event Progress Bar -->
    <div id="eventProgressBar" class="event-progress-bar">
        <div id="eventProgressFill" class="event-progress-fill"></div>
        <span id="eventProgressTime" class="event-progress-time"></span>
    </div>

    <!-- Watermark (visible in immersive mode) -->
    <div class="watermark">
        <span>past.El</span>
    </div>

    <script src="track-identity.js"></script>
    <script src="catalog.js"></script>
    <script src="audio.js"></script>
    <script src="midi.js"></script>
    <script src="event.js"></script>
    <script src="export.js"></script>
    <script type="module" src="visualizer.js"></script>

    <script>
        // ─── URL PARAM HANDLING ───────────────────────────────────────────
        (function applyUrlParams() {
            const params = new URLSearchParams(window.location.search);

            // ?embed=true — clean embed for Wix / superfan / iframe
            if (params.get('embed') === 'true') {
                document.body.classList.add('embed-mode');
            }

            // ?autoplay=true — auto-switch to Catalog mode and start first track
            if (params.get('autoplay') === 'true') {
                window.addEventListener('DOMContentLoaded', () => {
                    const catalogBtn = document.getElementById('modeCatalogBtn');
                    if (catalogBtn) setTimeout(() => catalogBtn.click(), 500);
                });
            }

            // ?mode=event — launch directly into Event Mode
            if (params.get('mode') === 'event') {
                window.addEventListener('DOMContentLoaded', () => {
                    const eventBtn = document.getElementById('modeEventBtn');
                    if (eventBtn) setTimeout(() => eventBtn.click(), 500);
                });
            }

            // ?track=id — open to a specific catalog track
            const trackId = params.get('track');
            if (trackId) {
                window.addEventListener('DOMContentLoaded', () => {
                    const sel = document.getElementById('trackSelector');
                    if (sel) {
                        setTimeout(() => {
                            const opt = Array.from(sel.options).find(o => o.value === trackId);
                            if (opt) { sel.value = trackId; sel.dispatchEvent(new Event('change')); }
                        }, 800);
                    }
                });
            }
        })();

        // ─── BEAT UI ─────────────────────────────────────────────────────
        (function updateBeatUI() {
            const dot = document.getElementById('beatDot');
            const bpmEl = document.getElementById('bpmDisplay');
            const statusEl = document.getElementById('catalogPlaybackStatus');
            const audio = window.audioData;
            if (audio && audio.isActive) {
                if (audio.isBeat && dot) {
                    dot.classList.add('flash');
                    setTimeout(() => dot.classList.remove('flash'), 120);
                }
                if (bpmEl && audio.bpm > 0) {
                    bpmEl.textContent = audio.bpm + ' BPM';
                }
            }

            // Catalog playback status
            const player = document.getElementById('catalogAudioPlayer');
            if (statusEl && player && player.src && !player.paused) {
                const pct = player.duration ? Math.round((player.currentTime / player.duration) * 100) : 0;
                statusEl.textContent = `▶ Playing... ${pct}%`;
                statusEl.style.opacity = '1';
            } else if (statusEl) {
                statusEl.style.opacity = '0';
            }

            requestAnimationFrame(updateBeatUI);
        })();
    </script>
</body>

</html>
